          btn.textContent = chip.label;
          btn.addEventListener('click', function () {
            if (chip.type === 'topic') {
              activeBubbleId    = chip.topicId || null;
              nextPrefillOrigin = 'suggestion_topic';
              chatInput.value   = topicPrompt(chip.topicId, chip.topicLabel || chip.label);
            } else {
              nextPrefillOrigin = 'suggestion_question';
              chatInput.value   = chip.label;
            }
            chatInput.focus();
          });
          chipsEl.appendChild(btn);
        });
        msgEl.appendChild(chipsEl);
      }

      scrollBottom();
    }

    /* ── Init: load topics from backend, fall back to hardcoded list ── */
    async function init() {
      var topics = TOPICS;
      try {
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 5000);
        var res = await fetch(api('/graph'), { signal: controller.signal });
        clearTimeout(timer);
        if (res.ok) {
          var raw = await res.json();
          var rawTopics = Array.isArray(raw.topics) ? raw.topics :
                         Array.isArray(raw.topic_nodes) ? raw.topic_nodes : [];
          if (rawTopics.length) {
            /* Build a label→activation map from backend, then merge into TOPICS */
            var actMap = {};
            rawTopics.forEach(function (t) {
              var key = (t.label || String(t.id || '')).toLowerCase();
              actMap[key] = Number(t.activation) || 0;
            });
            topics = TOPICS.map(function (t) {
              var key = t.label.toLowerCase();
              return { id: t.id, label: t.label, activation: actMap[key] !== undefined ? actMap[key] : t.activation };
            });
          }
        }
      } catch (_) { /* keep TOPICS */ }
      buildBubbles(topics);
    }

    /* Surfaces hidden only with opacity keep their controls in the tab order,
       so a keyboard user on the landing page walked 17 invisible stops (chat
       panel, CTA footer, both modals, voice overlay) and never reached a topic
       at all. Mark whatever is currently not visible as inert. Driven off
       computed style and re-synced on any class/style change or transition
       end, so it cannot drift out of step with the state machine. */
    var INERT_SURFACES = ['.landing-topbar', '.landing-overlay', '.landing-foot',
                          '.chat-panel', '.cta-footer', '.topics-back-pill',
                          '#msgModal', '#voiceOverlay'];
    function syncInert() {
      INERT_SURFACES.forEach(function (sel) {
        Array.prototype.forEach.call(document.querySelectorAll(sel), function (el) {
          var cs = getComputedStyle(el);
          var hidden = cs.display === 'none' || cs.visibility === 'hidden' ||
                       parseFloat(cs.opacity) === 0;
          if (hidden) {
            /* never inert an ancestor of what the user is currently on */
            if (el.contains(document.activeElement) && document.activeElement !== document.body) return;
            if (!el.hasAttribute('inert')) el.setAttribute('inert', '');
          } else if (el.hasAttribute('inert')) {
            el.removeAttribute('inert');
          }
        });
      });
    }
    var _inertQueued = false;
    function queueSyncInert() {
      if (_inertQueued) return;
      _inertQueued = true;
      requestAnimationFrame(function () { _inertQueued = false; syncInert(); });
    }
    /* class flips start the fade; transitionend catches the settled value */
    new MutationObserver(queueSyncInert).observe(document.documentElement, {
      attributes: true, subtree: true, attributeFilter: ['class', 'style']
    });
    document.addEventListener('transitionend', function (e) {
      if (e.propertyName === 'opacity') queueSyncInert();
    }, true);
    queueSyncInert();

    /* Redraw on resize */
    var _resizeT;
    window.addEventListener('resize', function () {
      clearTimeout(_resizeT);
      _resizeT = setTimeout(function () {
        if (!simulation) return;
        measureLandingGuard();
        d3.select(svgEl).attr('viewBox', '0 0 ' + vw() + ' ' + vh());
        if (appState === 'chat') shiftBubblesToSides();
        else {
          var _isMob = vw() < 720;
          var _vh = vh();
          var _clusterMode = bodyEl.getAttribute('data-bubble-style') === 'constellation';
          simulation.force('x', d3.forceX(vw() / 2).strength(_isMob ? 0.007 : 0.010));
          simulation.force('y', _isMob
            ? d3.forceY(function (d) {
                return d.bandGroup === 'top'
                  ? _vh * (_clusterMode ? 0.24 : 0.20)
                  : _vh * (_clusterMode ? 0.72 : 0.76);
              }).strength(0.055)
            : d3.forceY(_vh / 2).strength(0.010));
          simulation.alpha(0.3).restart();
        }
      }, 200);
    });

    init();

    // ── Voice mode ──────────────────────────────────────────────
    var voiceAudioEl = document.getElementById('voiceAudio');
    var voiceStatusEl = document.getElementById('voiceStatus');
    var voiceTranscriptEl = document.getElementById('voiceTranscript');
    var voiceMicBtn = document.getElementById('voiceMicBtn');
    var voiceCloseBtn = document.getElementById('voiceClose');

    var SPEECH_THRESHOLD = 0.06;
    var BARGE_IN_FRAMES = 8; // ~130ms of sustained energy required to trigger barge-in
    var bargeinFrameCount = 0;
    var voiceWs = null;
    var voiceAudioCtx = null;
    var voiceAnalyser = null;
    var voiceVadData = null;
    var voiceRefreshTimer = null;
    var voicePcmFlushTimer = null;
    var isPlayingTTS = false;
    var ttsQueue = [];
    var currentTTSController = null;
    var voiceMicStream = null;

    function setVoiceState(state, msg) {
      var bodyEl = document.body;
      bodyEl.classList.remove('voice-listening', 'voice-processing', 'voice-speaking', 'voice-error');
      var labels = { listening: 'Listening…', processing: 'Processing…', speaking: 'Speaking…', idle: 'Tap mic to speak' };
      if (state !== 'idle') bodyEl.classList.add('voice-' + state);
      voiceStatusEl.textContent = msg || labels[state] || '';
      if (voiceMicBtn) voiceMicBtn.classList.toggle('is-active', state === 'listening' || state === 'speaking');
    }

    function enterVoiceMode() {
      document.body.classList.add('state-voice');
      setVoiceState('idle');
      initVoiceSession();
    }

    function exitVoiceMode() {
      document.body.classList.remove('state-voice', 'voice-listening', 'voice-processing', 'voice-speaking', 'voice-error');
      teardownVoice();
    }

    function teardownVoice() {
      if (voiceWs) { voiceWs.close(); voiceWs = null; }
      if (voiceAudioCtx) { voiceAudioCtx.close(); voiceAudioCtx = null; }
      if (voiceMicStream) { voiceMicStream.getTracks().forEach(function(t){ t.stop(); }); voiceMicStream = null; }
      if (voiceRefreshTimer) { clearTimeout(voiceRefreshTimer); voiceRefreshTimer = null; }
      if (voicePcmFlushTimer) { clearInterval(voicePcmFlushTimer); voicePcmFlushTimer = null; }
      if (voiceAudioEl) {
        var leakedUrl = voiceAudioEl.src;
        voiceAudioEl.pause();
        voiceAudioEl.onended = null;
        voiceAudioEl.ontimeupdate = null;
        voiceAudioEl.src = '';
        if (leakedUrl && leakedUrl.startsWith('blob:')) URL.revokeObjectURL(leakedUrl);
      }
      ttsQueue.length = 0;
      if (currentTTSController) { currentTTSController.abort(); currentTTSController = null; }
      if (prefetchController) { prefetchController.abort(); prefetchController = null; }
      if (prefetchBlob) { URL.revokeObjectURL(prefetchBlob.url); prefetchBlob = null; }
      isPlayingTTS = false;
      bargeinFrameCount = 0;
      voiceAnalyser = null;
      voiceVadData = null;
    }

    function initVoiceSession() {
      fetch(BASE + '/voice/stt-token')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var token = data.token;
          var ws = new WebSocket('wss://streaming.assemblyai.com/v3/ws?sample_rate=16000&speech_model=u3-rt-pro&token=' + token);
          voiceWs = ws;
          ws.onopen = function() {
            startListening();
          };
          ws.onmessage = function(e) {
            var msg = JSON.parse(e.data);
            console.log('[ASR]', msg.type, msg);
            if (msg.type === 'Error') {
              // Null voiceWs before close so onclose doesn't reconnect
              voiceWs = null;
              ws.close();
              if (document.body.classList.contains('state-voice')) {
                setVoiceState('error', msg.error || 'Connection error');
              }
              return;
            }
            if (msg.type === 'Turn') {
              if (msg.end_of_turn && msg.transcript && msg.transcript.trim()) {
                handleVoiceTranscript(msg.transcript.trim(), msg.end_of_turn_confidence);
              }
            }
          };
          ws.onerror = function() {
            if (document.body.classList.contains('state-voice')) setVoiceState('error', 'Connection error');
          };
          ws.onclose = function() {
            if (document.body.classList.contains('state-voice') && voiceWs === ws) {
              setTimeout(initVoiceSession, 1000);
            }
          };
          if (voiceRefreshTimer) clearTimeout(voiceRefreshTimer);
          voiceRefreshTimer = setTimeout(function() {
            if (document.body.classList.contains('state-voice')) {
              if (voiceWs) { voiceWs.close(); voiceWs = null; }
              initVoiceSession();
            }
          }, 4 * 60 * 1000);
        })
        .catch(function() {
          setVoiceState('error', 'Could not connect');
        });
    }

    function startListening() {
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
        .then(function(stream) {
          voiceMicStream = stream;
          voiceAudioCtx = new AudioContext({ sampleRate: 16000 });
          return voiceAudioCtx.audioWorklet.addModule('/assets/pcm-processor.js').then(function() {
            var source = voiceAudioCtx.createMediaStreamSource(stream);
            var workletNode = new AudioWorkletNode(voiceAudioCtx, 'pcm-processor');
            // AssemblyAI v3 requires ≥50ms (800 samples) per send.
            // Accumulate to 100ms normally; flush remainder every 50ms padded to min.
            var pcmBuffer = new Int16Array(0);
            var PCM_SEND_SAMPLES = 1600; // 100ms normal batch
            var PCM_MIN_SAMPLES = 800;   // 50ms minimum AssemblyAI accepts
            workletNode.port.onmessage = function(e) {
              if (!voiceWs || voiceWs.readyState !== WebSocket.OPEN || isPlayingTTS) return;
              var incoming = new Int16Array(e.data);
              var merged = new Int16Array(pcmBuffer.length + incoming.length);
              merged.set(pcmBuffer);
              merged.set(incoming, pcmBuffer.length);
              pcmBuffer = merged;
              while (pcmBuffer.length >= PCM_SEND_SAMPLES) {
                voiceWs.send(pcmBuffer.slice(0, PCM_SEND_SAMPLES).buffer);
                pcmBuffer = pcmBuffer.slice(PCM_SEND_SAMPLES);
              }
            };
            // Flush any partial buffer every 50ms so end-of-speech words aren't lost
            if (voicePcmFlushTimer) clearInterval(voicePcmFlushTimer);
            voicePcmFlushTimer = setInterval(function() {
              if (!voiceWs || voiceWs.readyState !== WebSocket.OPEN || isPlayingTTS || pcmBuffer.length === 0) return;
              var toSend = pcmBuffer.length >= PCM_MIN_SAMPLES
                ? pcmBuffer.slice(0, pcmBuffer.length)
                : (() => { var p = new Int16Array(PCM_MIN_SAMPLES); p.set(pcmBuffer); return p; })();
              voiceWs.send(toSend.buffer);
              pcmBuffer = new Int16Array(0);
            }, 50);
            voiceAnalyser = voiceAudioCtx.createAnalyser();
            voiceAnalyser.fftSize = 256;
            source.connect(voiceAnalyser);
            source.connect(workletNode);
            voiceVadData = new Float32Array(voiceAnalyser.frequencyBinCount);
            setVoiceState('listening');
            requestAnimationFrame(checkVAD);
          });
        })
        .catch(function() {
          setVoiceState('error', 'Microphone access denied');
        });
    }

    function checkVAD() {
      if (!voiceAnalyser || !document.body.classList.contains('state-voice')) return;
      if (isPlayingTTS) {
        voiceAnalyser.getFloatTimeDomainData(voiceVadData);
        var sum = 0;
        for (var i = 0; i < voiceVadData.length; i++) sum += voiceVadData[i] * voiceVadData[i];
        var rms = Math.sqrt(sum / voiceVadData.length);
        if (rms > SPEECH_THRESHOLD) {
          bargeinFrameCount++;
          if (bargeinFrameCount >= BARGE_IN_FRAMES) {
            bargeinFrameCount = 0;
            handleBargein();
            return;
          }
        } else {
          bargeinFrameCount = 0;
        }
      } else {
        bargeinFrameCount = 0;
      }
      requestAnimationFrame(checkVAD);
    }

    function handleBargein() {
      if (voiceAudioEl) voiceAudioEl.pause();
      if (currentTTSController) { currentTTSController.abort(); currentTTSController = null; }
      if (prefetchController) { prefetchController.abort(); prefetchController = null; }
      if (prefetchBlob) { URL.revokeObjectURL(prefetchBlob.url); prefetchBlob = null; }
      ttsQueue.length = 0;
      isPlayingTTS = false;
      setVoiceState('listening');
      requestAnimationFrame(checkVAD);
    }

    var sentenceBuffer = '';

    /* One voice turn spans three requests (/chat, /voice/tts, /voice/turn) plus
       a browser-to-AssemblyAI socket the backend never sees. This id is the
       only thing tying them together in tracing. */
    var voiceTurnId = null;
    var voiceTurnStats = null;

    function newTurnId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'turn-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    }

    function handleVoiceTranscript(text, confidence) {
      setVoiceState('processing');
      addUserMessage(text);
      sentenceBuffer = '';
      voiceTurnId = newTurnId();
      voiceTurnStats = {
        transcript: text,
        confidence: (typeof confidence === 'number' ? confidence : null),
        sentences: 0,
        chars: 0,
      };
      sendToApi(text, null, null, { voice_mode: true, turn_id: voiceTurnId });
    }

    /* Report the browser-side legs once the answer is fully segmented. Fire and
       forget: tracing must never delay or break playback. */
    function reportVoiceTurn() {
      if (!voiceTurnId || !voiceTurnStats) return;
      var body = {
        turn_id: voiceTurnId,
        session_id: SESSION_ID,
        transcript: voiceTurnStats.transcript,
        tts_sentences: voiceTurnStats.sentences,
        tts_chars: voiceTurnStats.chars,
      };
      if (voiceTurnStats.confidence !== null) body.confidence = voiceTurnStats.confidence;
      voiceTurnStats = null;
      try {
        fetch(BASE + '/voice/turn', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          keepalive: true,
        }).catch(function () {});
      } catch (_) {}
    }

    function flushSentenceBuffer() {
      if (sentenceBuffer.trim()) {
        enqueueTTS(sentenceBuffer.trim());
        sentenceBuffer = '';
      }
      reportVoiceTurn();
    }

    function trySplitSentence() {
      // Split on sentence boundary: punctuation followed by space+uppercase, or end with punctuation
      var match = sentenceBuffer.match(/^(.*?[.?!…])\s+(?=[A-Z])/);
      if (match && match[1].length >= 20) {
        enqueueTTS(match[1].trim());
        sentenceBuffer = sentenceBuffer.slice(match[0].length);
        trySplitSentence(); // handle multiple sentences in buffer
      }
    }

    var prefetchBlob = null; // { text, url } — pre-fetched next sentence
    var prefetchController = null;

    function fetchTTSBlob(text, signal) {
      return fetch(BASE + '/voice/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, turn_id: voiceTurnId }),
        signal: signal,
      }).then(function(r) { return r.blob(); });
    }

    function maybePrefetchNext() {
      if (!ttsQueue.length || prefetchBlob || prefetchController) return;
      var nextText = ttsQueue[0];
      prefetchController = new AbortController();
      fetchTTSBlob(nextText, prefetchController.signal)
        .then(function(blob) {
          prefetchBlob = { text: nextText, url: URL.createObjectURL(blob) };
          prefetchController = null;
        })
        .catch(function() { prefetchController = null; });
    }

    function enqueueTTS(text) {
      if (!text) return;
      if (voiceTurnStats) {
        voiceTurnStats.sentences += 1;
        voiceTurnStats.chars += text.length;
      }
      ttsQueue.push(text);
      if (!isPlayingTTS) playNextTTS();
      else maybePrefetchNext();
    }

    function playNextTTS() {
      if (!ttsQueue.length) {
        isPlayingTTS = false;
        if (document.body.classList.contains('state-voice')) setVoiceState('listening');
        return;
      }
      var text = ttsQueue.shift();
      currentTTSController = new AbortController();
      isPlayingTTS = true;
      setVoiceState('speaking');

      var blobPromise;
      if (prefetchBlob && prefetchBlob.text === text) {
        var cached = prefetchBlob;
        prefetchBlob = null;
        blobPromise = Promise.resolve(null); // url already in cached.url
        // play immediately from prefetch
        voiceAudioEl.src = cached.url;
        voiceAudioEl.play();
        maybePrefetchNext();
        voiceAudioEl.onended = function() {
          URL.revokeObjectURL(cached.url);
          isPlayingTTS = false;
          playNextTTS();
        };
        return;
      } else {
        blobPromise = fetchTTSBlob(text, currentTTSController.signal);
      }

      blobPromise
        .then(function(blob) {
          var url = URL.createObjectURL(blob);
          voiceAudioEl.src = url;
          voiceAudioEl.play();
          maybePrefetchNext();
          voiceAudioEl.onended = function() {
            URL.revokeObjectURL(url);
            isPlayingTTS = false;
            playNextTTS();
          };
        })
        .catch(function(e) {
          isPlayingTTS = false;
          if (e.name !== 'AbortError' && document.body.classList.contains('state-voice')) {
            setVoiceState('error', 'Audio error');
          }
        });
    }

    if (voiceMicBtn) {
      voiceMicBtn.addEventListener('click', function() {
        if (document.body.classList.contains('state-voice')) {
          exitVoiceMode();
        } else {
          enterVoiceMode();
        }
      });
    }
    var landingVoiceBtn = document.getElementById('landingVoiceBtn');
    if (landingVoiceBtn) {
      landingVoiceBtn.addEventListener('click', enterVoiceMode);
    }
    if (voiceCloseBtn) {
      voiceCloseBtn.addEventListener('click', exitVoiceMode);
    }
    // ── End voice mode ──────────────────────────────────────────

  })();
  </script>
</body>
</html>
