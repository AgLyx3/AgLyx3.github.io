<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yixin Li</title>
<meta name="description" content="Yixin Li builds products at the intersection of Human and AI. Chat with my agent, or explore what I've built.">

<!-- Apply saved colour theme before first paint to avoid a flash -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('px_theme');
      var theme = stored || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<link rel="preload" as="font" type="font/woff2" href="assets/fonts/Satoshi-Variable.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/Ephesis-Regular.woff2" crossorigin>
<link rel="stylesheet" href="assets/pixel-system.css">
<script defer src="assets/pixel-system.js"></script>
<style>
  /* Self-hosted. Fontshare serves protocol-relative URLs that break on file://,
     and silently drops families from combined requests. */
  @font-face {
    font-family: 'Satoshi';
    src: url('assets/fonts/Satoshi-Variable.woff2') format('woff2');
    font-weight: 300 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Satoshi';
    src: url('assets/fonts/Satoshi-VariableItalic.woff2') format('woff2');
    font-weight: 300 900; font-style: italic; font-display: swap;
  }
  /* Ephesis ships one weight only. Never ask for 500+ or the browser
     synthesises a bold, which destroys a fine calligraphic face. */
  @font-face {
    font-family: 'Ephesis';
    src: url('assets/fonts/Ephesis-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }

  :root {
    --paper:        #F8F4EE;
    --paper-2:      #E9D9C9;
    --paper-edge:   #CFBEAE;
    --ink:          #2F2C31;
    --ink-2:        #4A4750;
    --ink-3:        #716D73;
    --ink-4:        #9D97A0;
    --forest:       #536C89;
    --forest-hover: #425978;
    --forest-soft:  #D8E0EC;
    --ease-out:     cubic-bezier(0.2, 0.7, 0.2, 1);
    /* Two families. Ephesis is the logotype and nothing else. */
    --font-display: 'Ephesis', 'Snell Roundhand', cursive;
    --font-sans:    'Satoshi', -apple-system, 'Helvetica Neue', sans-serif;
    --font-code:    ui-monospace, SFMono-Regular, Menlo, monospace;
    --ink-rgb:    47, 44, 49;
    --paper-rgb:  248, 244, 238;
    --forest-rgb: 83, 108, 137;
  }
  html[data-theme="dark"] {
    --paper:        #0B1024;
    --paper-2:      #1A2340;
    --paper-edge:   #2B3766;
    --ink:          #EAEBF6;
    --ink-2:        #C3C7E2;
    --ink-3:        #9094BC;
    --ink-4:        #646890;
    --forest:       #93B4EC;
    --forest-hover: #B2CBF6;
    --forest-soft:  #1B2649;
    --ink-rgb:    234, 235, 246;
    --paper-rgb:  11, 16, 36;
    --forest-rgb: 147, 180, 236;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

  body {
    /* Was overflow:hidden, which trapped content on short viewports.
       Column flex so the footer lands at the bottom of the viewport without
       position:fixed on small screens, and no dead space is left below. */
    font-family: var(--font-sans); color: var(--ink); overflow-x: hidden;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(circle at top left,
        rgba(110,134,171,0.16) 0%, rgba(110,134,171,0.04) 24%, rgba(248,244,238,0) 48%),
      linear-gradient(180deg,
        rgba(216,224,236,0.22) 0%, rgba(248,244,238,0.68) 22%, rgba(248,244,238,0.96) 100%),
      var(--paper);
  }
  html[data-theme="dark"] body {
    background:
      radial-gradient(circle at 80% 16%, rgba(205,215,245,0.14) 0%, rgba(205,215,245,0.04) 16%, rgba(11,16,36,0) 34%),
      radial-gradient(ellipse at 50% -10%, rgba(60,82,150,0.30) 0%, rgba(11,16,36,0) 55%),
      linear-gradient(180deg, #131A3A 0%, #0C1228 46%, #070A18 100%),
      var(--paper);
  }

  /* starfield (dark only) */
  #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: none; opacity: 0; transition: opacity 600ms var(--ease-out); }
  html[data-theme="dark"] #starfield { display: block; opacity: 1; }
  .star { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 4px 1px rgba(255,255,255,0.55);
          animation: twinkle var(--tw-dur, 4s) ease-in-out infinite; animation-delay: var(--tw-delay, 0s); }
  @keyframes twinkle { 0%,100% { opacity: 0.18; } 50% { opacity: var(--tw-max, 0.9); } }

  /* soft floating dots (light-mode bubble motif) */
  .field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  html[data-theme="dark"] .field { display: none; }
  .dot { position: absolute; border-radius: 50%; background: rgba(var(--forest-rgb), 0.10); animation: drift 18s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }

  /* flex:1 lets the wrap absorb the leftover height instead of forcing a full
     viewport of its own, which is what made the mobile page overrun. */
  .wrap { position: relative; z-index: 2; flex: 1 0 auto; display: flex;
          align-items: center; justify-content: center; padding: 88px 24px 104px; }

  /* Asymmetric: the name holds the left, the two ways in stack on the right.
     No cards, no icon tiles, no symmetry. */
  .asym { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(30px, 6vw, 76px);
          align-items: center; width: min(1000px, 100%); }

  .asym-left { position: relative; top: -18px; animation: rise 600ms 80ms var(--ease-out) both; }
  .name-reveal { position: relative; display: inline-block; }
  .name-reveal:hover,
  .name-reveal:focus-within,
  .name-reveal.is-revealed { z-index: 4; }
  /* Script: small x-height needs a bigger em, and the y-descender needs headroom. */
  .name { font-family: var(--font-display); font-weight: 400; font-size: clamp(56px, 7.4vw, 112px);
          position: relative; z-index: 1; line-height: 1.2; letter-spacing: 0.01em;
          padding-bottom: 0.06em; color: var(--ink); }
  .name-trigger { display: block; padding: 0; border: 0; font: inherit; line-height: inherit;
                  letter-spacing: inherit; color: inherit; background: none; cursor: default; }
  .name-trigger:focus-visible { outline: 2px solid var(--forest); outline-offset: 6px; border-radius: 2px; }

  /* The portrait behaves like a loose print laid behind the page at rest,
     then rises above the content when either it or the name is active. */
  .name-portrait { --portrait-image: url('assets/yixin-portrait.jpg');
                   --portrait-ambient-opacity: 0.24;
                   --portrait-ratio: 993 / 1400;
                   --portrait-rest: translate(6px, 12px) rotate(-2deg) scale(0.94);
                   --portrait-active: translate(-8px, 18px) rotate(-4deg) scale(1);
                   position: absolute; left: 42%; top: calc(54% + 42px); z-index: 0;
                   width: clamp(158px, 15vw, 180px); aspect-ratio: var(--portrait-ratio);
                   padding: 0; margin: 0; overflow: hidden; border: 0; border-radius: 3px;
                   background: transparent;
                   box-shadow: none; opacity: 1; pointer-events: auto;
                   transform: var(--portrait-rest);
                   transform-origin: 32% 10%;
                   transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out); }
  .name-portrait::before { content: ''; position: absolute; inset: 0; z-index: 0;
                           background: var(--portrait-image) center / cover no-repeat;
                           opacity: var(--portrait-ambient-opacity);
                           -webkit-mask-image:
                             linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
                             linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
                           -webkit-mask-composite: source-in;
                           mask-image:
                             linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
                             linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
                           mask-composite: intersect;
                           filter: drop-shadow(0 18px 28px rgba(var(--forest-rgb), 0.16));
                           transition: opacity 420ms var(--ease-out); }
  .name-portrait img { position: relative; z-index: 1; display: block; width: 100%; height: 100%;
                       object-fit: cover; border-radius: 1px; opacity: 0;
                       transition: opacity 420ms var(--ease-out); }
  .name-portrait-secondary { --portrait-image: url('assets/yixin-portrait-2.jpg');
                             --portrait-ambient-opacity: 0.28;
                             --portrait-ratio: 933 / 1400;
                             --portrait-rest: translate(7px, 10px) rotate(2deg) scale(0.94);
                             --portrait-active: translate(8px, 18px) rotate(4deg) scale(1);
                             left: 92%; top: calc(50% + 48px);
                             width: clamp(176px, 16.5vw, 200px); }
  .name-reveal:hover .name-portrait,
  .name-reveal:focus-within .name-portrait,
  .name-reveal.is-revealed .name-portrait { z-index: 5; opacity: 1;
                                            box-shadow: 0 0 0 4px rgba(216, 224, 236, 0.72),
                                                        0 24px 64px rgba(var(--forest-rgb), 0.18),
                                                        0 7px 22px rgba(var(--forest-rgb), 0.12);
                                            transform: var(--portrait-active);
                                            transition-delay: 0s; }
  .name-reveal .name-portrait:hover { z-index: 6; }
  .name-reveal:hover .name-portrait::before,
  .name-reveal:focus-within .name-portrait::before,
  .name-reveal.is-revealed .name-portrait::before { opacity: 0; }
  .name-reveal:hover .name-portrait img,
  .name-reveal:focus-within .name-portrait img,
  .name-reveal.is-revealed .name-portrait img { opacity: 1; }
  .tagline { font-family: var(--font-sans); font-size: clamp(16px, 1.5vw, 19px); font-weight: 400;
             position: relative; z-index: 1; letter-spacing: -0.005em; color: var(--ink-2);
             line-height: 1.55; max-width: 30ch; margin-top: 10px; }
  .tagline .accent { font-style: italic; font-weight: 500; color: var(--forest); }

  /* One duration and one easing for every moving part, so the whole row
     resolves as a single gesture instead of three overlapping ones. */
  .ways { --way-dur: 420ms; --way-ease: cubic-bezier(0.2, 0.7, 0.2, 1); position: relative; z-index: 1;
          animation: rise 600ms 220ms var(--ease-out) both; }

  .way { display: block; text-decoration: none; padding: 22px 0;
         border-top: 1px solid rgba(var(--forest-rgb), 0.22); }
  .way:last-child { border-bottom: 1px solid rgba(var(--forest-rgb), 0.22); }
  .way:focus-visible { outline: 2px solid var(--forest); outline-offset: 4px; }

  .way-title { display: flex; align-items: center; justify-content: space-between; gap: 14px;
               font-family: var(--font-sans); font-size: clamp(20px, 2.05vw, 25px); font-weight: 600;
               letter-spacing: -0.02em; color: var(--ink); }
  .way-desc { font-family: var(--font-sans); font-size: 14.5px; font-weight: 400; color: var(--ink-3);
              line-height: 1.5; margin-top: 6px; max-width: 32ch; }

  /* Slide the text, not the row. transform composites; padding-left forced a
     layout pass every frame, which was the stutter. Hairlines and orb stay put. */
  .way-label, .way-desc { display: block; transition: transform var(--way-dur) var(--way-ease); }
  .way:hover .way-label, .way:hover .way-desc,
  .way:focus-visible .way-label, .way:focus-visible .way-desc { transform: translateX(13px); }

  /* Orb marker: the site's own bubble at glyph scale, and absent until the
     cursor arrives. It blooms in rather than sitting there as decoration.
     The 22px box is always reserved, so nothing reflows when it appears.
     Only opacity and transform animate — both composite. */
  .orb-mark { flex-shrink: 0; width: 22px; height: 22px;
              display: flex; align-items: center; justify-content: center; }
  .orb-mark i { width: 13px; height: 13px; border-radius: 50%; will-change: transform, opacity;
    background: rgba(var(--forest-rgb), 1);
    box-shadow: 0 0 13px 2px rgba(var(--forest-rgb), 0.55);
    opacity: 0; transform: scale(0.35);
    transition: opacity   var(--way-dur) var(--way-ease),
                transform var(--way-dur) var(--way-ease); }
  .way:hover .orb-mark i, .way:focus-visible .orb-mark i {
    opacity: 1; transform: scale(1); }

  .foot { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 14px;
          align-items: center; font-family: var(--font-sans); font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
  .foot a { color: var(--ink-3); text-decoration: none; transition: color 140ms; }
  .foot a:hover { color: var(--forest); }
  .lf-dot { color: var(--paper-edge); }

  /* theme toggle */
  .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0;
    border: 1px solid rgba(var(--forest-rgb), 0.22); border-radius: 999px; background: rgba(var(--paper-rgb), 0.55); color: var(--ink-3);
    cursor: pointer; -webkit-appearance: none; appearance: none; transition: color 140ms, border-color 140ms, background 140ms; }
  .theme-toggle:hover { color: var(--forest); border-color: rgba(var(--forest-rgb), 0.44); }
  .theme-toggle svg { width: 16px; height: 16px; display: block; }
  .theme-toggle .icon-sun { display: none; } .theme-toggle .icon-moon { display: block; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; } html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Tablet: the two columns stop fitting side by side well before phone width. */
  @media (max-width: 860px) {
    .asym { grid-template-columns: 1fr; gap: 30px; align-items: start; }
    .tagline { max-width: 46ch; }
    .way-desc { max-width: none; }
    .wrap { padding: 72px 24px 92px; }
  }

  @media (max-width: 640px) {
    .wrap { padding: 44px 22px 26px; }
    .asym { gap: 26px; }
    .asym-left { top: -12px; }
    .name { font-size: clamp(46px, 13.5vw, 68px); }
    .name-portrait { --portrait-rest: translate(4px, 8px) rotate(-2deg) scale(0.94);
                     --portrait-active: translate(-2px, 4px) rotate(-4deg) scale(1);
                     left: 38px; top: -158px; width: min(34vw, 136px); }
    .name-portrait-secondary { --portrait-rest: translate(5px, 8px) rotate(2deg) scale(0.94);
                               --portrait-active: translate(4px, 8px) rotate(4deg) scale(1);
                               left: 166px; top: -162px; width: min(37vw, 146px); }
    .tagline { font-size: 16px; margin-top: 8px; }

    /* Full-bleed rules: the hairlines reach both screen edges and organise the
       page, while the text stays inset on the same 22px margin as everything else. */
    .ways { margin-left: -22px; margin-right: -22px; }
    .way { padding: 18px 22px; }
    .way-title { font-size: 20px; }
    .way-desc { font-size: 14px; margin-top: 4px; }

    /* Static, so it rides the bottom of the body flex column rather than
       floating over the rows. */
    .foot { position: static; transform: none; margin: 0; padding: 0 22px 22px;
            gap: 12px; flex-wrap: wrap; justify-content: center; }
  }

  /* Pointer-less devices never resolve :hover, so a cursor-reveal can't fire.
     Drop the orb entirely there rather than leave a dot that means nothing,
     and don't slide the text under a thumb. The title and hairline already
     carry the affordance. */
  @media (hover: none) {
    .orb-mark { display: none; }
    .way:hover .way-label, .way:hover .way-desc { transform: none; }
    .name-reveal:not(.is-revealed) .name-portrait {
      z-index: 0; box-shadow: none;
      transform: var(--portrait-rest);
    }
    .name-reveal:not(.is-revealed) .name-portrait::before { opacity: var(--portrait-ambient-opacity); }
    .name-reveal:not(.is-revealed) .name-portrait img { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ── galaxy: milky-way band + meteors (dark only) ── */
  #galaxy-mw { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: none; }
  html[data-theme="dark"] #galaxy-mw { display: block; }
  #galaxy-mw .mwband { position: absolute; left: -20%; right: -20%; top: 6%; height: 62%;
    transform: rotate(-18deg); transform-origin: center; filter: blur(22px);
    background:
      radial-gradient(ellipse 60% 42% at 50% 50%, rgba(150,170,240,0.11), rgba(150,170,240,0) 70%),
      radial-gradient(ellipse 46% 30% at 42% 46%, rgba(205,150,215,0.09), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 40% 26% at 62% 54%, rgba(120,200,210,0.07), rgba(0,0,0,0) 70%); }
  .meteor { position: absolute; width: 150px; height: 2px; border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(200,220,255,0.85) 100%); }
  .meteor::after { content: ''; position: absolute; right: 0; top: 50%; width: 4px; height: 4px; border-radius: 50%;
    transform: translateY(-50%); background: #fff; box-shadow: 0 0 8px 3px rgba(255,255,255,0.7); }
  @keyframes shoot { 0% { opacity: 0; transform: rotate(25deg) translateX(0); }
    12% { opacity: 1; } 100% { opacity: 0; transform: rotate(25deg) translateX(560px); } }

  /* The nebula-glow door treatment lived here. Removed with the cards it was
     painted onto; the glow now belongs to the star markers instead. */
</style>
</head>
<body class="pixel-site" data-pixel-page="home">

  <div id="galaxy-mw" aria-hidden="true"></div>
  <div class="field" id="field" aria-hidden="true"></div>

  <main class="wrap">

        <a class="way" href="portfolio.html">

  <footer class="foot">

      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
    </button>
  </footer>

  <script>
    // starfield
    (function () {
      var field = document.getElementById('starfield'); if (!field) return;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 150; i++) {
        var s = document.createElement('span'); s.className = 'star';
        var size = (Math.random() * 1.6 + 0.6).toFixed(2);
        s.style.width = size + 'px'; s.style.height = size + 'px';
        s.style.top = (Math.random() * 100).toFixed(2) + '%'; s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.setProperty('--tw-dur', (Math.random() * 4 + 2.5).toFixed(2) + 's');
        s.style.setProperty('--tw-delay', (Math.random() * 5).toFixed(2) + 's');
        s.style.setProperty('--tw-max', (Math.random() * 0.5 + 0.5).toFixed(2));
        frag.appendChild(s);
      }
      field.appendChild(frag);
    })();
    // floating dots (light mode)
    (function () {
      var f = document.getElementById('field');
      for (var i=0;i<14;i++){ var d=document.createElement('span'); d.className='dot';
        var s=(Math.random()*70+20).toFixed(0); d.style.width=s+'px'; d.style.height=s+'px';
        d.style.top=(Math.random()*100).toFixed(1)+'%'; d.style.left=(Math.random()*100).toFixed(1)+'%';
        d.style.animationDelay=(Math.random()*-18).toFixed(1)+'s';
        d.style.animationDuration=(Math.random()*10+14).toFixed(1)+'s'; f.appendChild(d); }
    })();
    // theme toggle (persisted, shared key with chat app)
    (function () {
      var root = document.documentElement;
      function apply(t){ root.setAttribute('data-theme', t); try { localStorage.setItem('px_theme', t); } catch(e){} }
      document.querySelector('.theme-toggle').addEventListener('click', function(){
        apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    })();
    // Touch devices use an explicit reveal state because mobile browsers can
    // retain :hover after a tap. Tapping either target toggles; elsewhere closes.
    (function () {
      var reveal = document.querySelector('.name-reveal');
      var trigger = document.querySelector('.name-trigger');
      var touch = window.matchMedia && window.matchMedia('(hover: none)');
      if (!reveal || !trigger || !touch) return;

      function setRevealed(open) {
        reveal.classList.toggle('is-revealed', open);
        trigger.setAttribute('aria-expanded', String(open));
        if (!open) trigger.blur();
      }

      document.addEventListener('click', function (event) {
        if (!touch.matches) return;
        var target = event.target.closest('.name-trigger, .name-portrait');
        if (target && reveal.contains(target)) {
          setRevealed(!reveal.classList.contains('is-revealed'));
          return;
        }
        setRevealed(false);
      });
    })();
    // galaxy: milky-way band + periodic meteors
    (function () {
      var mw = document.getElementById('galaxy-mw'); if (!mw) return;
      var band = document.createElement('div'); band.className = 'mwband'; mw.appendChild(band);
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      function spawn () {
        var m = document.createElement('span'); m.className = 'meteor';
        m.style.left = (Math.random()*48 + 2) + '%';
        m.style.top = (Math.random()*26 + 3) + '%';
        var dur = (Math.random()*0.8 + 1.0);
        m.style.animation = 'shoot ' + dur.toFixed(2) + 's ease-in forwards';
        mw.appendChild(m);
        setTimeout(function () { m.remove(); }, dur*1000 + 120);
      }
      function loop () { spawn(); setTimeout(loop, Math.random()*3200 + 1800); }
      setTimeout(loop, 1000);
    })();
  </script>
</body>
</html>
